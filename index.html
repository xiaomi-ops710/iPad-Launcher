<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホーム画面ブックマーク</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sc:1;--is:calc(clamp(58px,8.2vw,92px)*var(--sc));--tx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#020a14;color:var(--tx);font-family:-apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
.wall{position:fixed;inset:0;background:radial-gradient(120% 80% at 20% 10%,#0a5f8f 0%,#053a60 35%,#01101f 75%);transition:filter .5s}
.wall svg{position:absolute;inset:0;width:100%;height:100%}
.glass{position:relative;isolation:isolate;--mx:30%;--my:0%;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 55%,rgba(255,255,255,.12));backdrop-filter:blur(var(--bl,20px)) saturate(2.2) brightness(1.12) contrast(1.05);-webkit-backdrop-filter:blur(var(--bl,20px)) saturate(2.2) brightness(1.12) contrast(1.05);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1.5px 1px rgba(255,255,255,.2),inset 1px 0 1px -.5px rgba(255,255,255,.3),inset 0 0 24px rgba(255,255,255,.07),0 14px 44px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.25)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 22%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.08) 72%,rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:-1;opacity:.85}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.32),transparent 45%),linear-gradient(180deg,rgba(255,255,255,.16),transparent 30%);pointer-events:none;z-index:-1}
.sb{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600;font-size:15px;z-index:5}
.sb .r{display:flex;gap:10px;align-items:center}
.bat{background:#ffd60a;color:#000;border-radius:7px;padding:1px 7px;font-size:13px;font-weight:700}
.sbtn{background:none;border:0;color:#fff;cursor:pointer;padding:4px;display:flex}
#pages{position:fixed;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;padding:calc(22px + env(safe-area-inset-top,0px)) 3vw 0;overflow-y:auto;scrollbar-width:none}
.grid{display:grid;justify-items:center;row-gap:22px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;width:calc(var(--is) + 30px);color:#fff;text-decoration:none;position:relative;-webkit-touch-callout:none}
.ic{position:relative;width:var(--is);height:var(--is);border-radius:23%;display:grid;place-items:center;overflow:hidden;font-size:calc(var(--is)*.52);box-shadow:0 5px 16px rgba(0,0,0,.42),0 0 0 .5px rgba(255,255,255,.12);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1.5px 2px -.5px rgba(255,255,255,.55),inset 0 0 12px rgba(255,255,255,.06);background:linear-gradient(160deg,rgba(255,255,255,.2),transparent 36%)}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from 200deg,rgba(255,255,255,.75),rgba(255,255,255,.04) 25%,rgba(255,255,255,.35) 55%,rgba(255,255,255,.04) 78%,rgba(255,255,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:1;opacity:.5;transition:opacity .3s}
.ic img{width:100%;height:100%;object-fit:cover}
.app:active .ic{transform:scale(.92)}
.app span{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mn{display:none;position:absolute;top:-6px;left:2px;width:26px;height:26px;border-radius:50%;place-items:center;font-style:normal;font-size:20px;line-height:1;background:rgba(150,160,170,.85);backdrop-filter:blur(10px);z-index:2}
.edit .mn{display:grid}
.edit .app .ic{animation:jig .25s infinite alternate}
.edit .app:nth-child(2n) .ic{animation-delay:-.12s;animation-direction:alternate-reverse}
@keyframes jig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media(prefers-reduced-motion:reduce){.edit .app .ic{animation:none}}
.dragging{opacity:.3}

.sep{width:1px;height:calc(var(--is)*.7);background:rgba(255,255,255,.3);flex:none}
.plus{width:calc(var(--is)*.82);height:calc(var(--is)*.82);border-radius:23%;display:none;place-items:center;font-size:30px;flex:none;cursor:pointer;border:1px dashed rgba(255,255,255,.5);background:none;color:#fff}

.tb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:20px;right:20px;display:none;justify-content:space-between;z-index:9}
.edit .tb{display:flex}.edit .sb{visibility:hidden}
.tb div{display:flex;gap:10px}
.pill{border:0;color:#fff;font-size:15px;padding:9px 18px;border-radius:22px;cursor:pointer;font-family:inherit}
/* library */
.lib{display:flex;flex-direction:column;gap:22px;align-items:center}

.res{display:grid;grid-template-columns:repeat(auto-fill,calc(var(--is) + 30px));justify-content:center;gap:22px;width:100%}
/* overlays */
.ov{position:fixed;inset:0;display:none;z-index:20;background:rgba(0,10,25,.32)}
.ov.show{display:flex}
.sp{margin:calc(60px + env(safe-area-inset-top,0px)) auto auto;width:min(760px,94vw);border-radius:32px;padding:16px 22px 22px;max-height:80%;overflow:auto}

.sug{display:grid;grid-template-columns:repeat(auto-fill,calc(var(--is) + 20px));gap:16px;justify-content:center}
.row{display:flex;gap:14px;align-items:center;padding:8px;border-radius:14px;cursor:pointer;color:#fff;text-decoration:none}
.row:hover,.row.f{background:rgba(255,255,255,.16)}
.row .ic{width:44px;height:44px;font-size:24px;flex:none}

.sheet{margin:auto;width:min(460px,94vw);border-radius:30px;padding:22px;max-height:92%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet label{display:block;font-size:13px;opacity:.8;margin:12px 0 5px}
.sheet input[type=text],.sheet textarea,.sheet input:not([type]){width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;padding:11px 13px;font-size:16px;font-family:inherit;outline:0}

.btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.pill.pri{background:#0a84ff}.pill.del{background:rgba(255,69,58,.8);margin-right:auto}
.pill.g{background:rgba(255,255,255,.18)}
.hint{text-align:center;opacity:.6;font-size:13px;padding:30px}
.app:hover .ic{transform:scale(1.06);box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 14px rgba(140,200,255,.18)}.app:hover .ic::before{opacity:1}

.rec .mn{display:none!important}
.hf{display:flex;flex-direction:column;align-items:center;gap:7px;width:calc(var(--is) + 30px);cursor:pointer;font-size:13px}
.hf span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hf .ft{width:var(--is);height:var(--is);padding:9%;gap:5%;border-radius:23%;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}

.edit .hf .ft{animation:jig .25s infinite alternate}
.fi{display:block;margin:6px auto 18px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.3);color:#fff;font-size:20px;text-align:center;font-family:inherit;outline:0;width:60%}
.sz{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:22px;font-size:14px}.sz input{width:110px;accent-color:#5ac8ff}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(70px)}to{opacity:1;transform:translateX(-50%)}}

.boot .app,.boot .hf{animation:pop .7s cubic-bezier(.2,.9,.3,1.25) both}

.ov.show{animation:ovin .25s both}.ov.show>.glass{animation:sheet .45s cubic-bezier(.2,.9,.3,1.15) both}
#dots i{transition:transform .3s,background .3s}#dots i.on{transform:scale(1.3)}
.pill{transition:transform .2s,filter .2s}.pill:hover{filter:brightness(1.2)}.pill:active{transform:scale(.94)}
.pg{will-change:transform}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ft{align-content:start}.ft .ic{height:auto;aspect-ratio:1}.hf .ft{grid-auto-rows:auto}
.glass::before{opacity:calc(.85*var(--gl,1))}.glass::after{opacity:var(--gl,1)}
.nolb .app span,.nolb .hf span{display:none}.noan *{animation:none!important;transition:none!important}
.wall.img{background-size:cover;background-position:center}.wall.img svg{display:none}
.bd{position:absolute;top:-6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;font-size:13px;font-weight:600;display:grid;place-items:center;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#dock .bd{right:-6px}
.wgs{display:grid;grid-template-columns:1fr 2fr;gap:22px;height:calc(2*(var(--is) + 52px) - 22px);margin:0 auto 22px;max-width:900px}

#cm{position:fixed;display:none;z-index:40;min-width:210px;padding:6px;border-radius:22px;animation:sheet .3s cubic-bezier(.2,.9,.3,1.15)}

#cm button:hover{background:rgba(255,255,255,.18)}#cm .dg{color:#ff6961}
#ts{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:45;padding:12px 18px;border-radius:24px;display:none;align-items:center;gap:14px;font-size:15px}
#ts.show{display:flex;animation:tsin .4s both}#ts button{background:none;border:0;color:#5ac8ff;font:inherit;font-weight:700;cursor:pointer}
@keyframes tsin{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%)}}
.sheet .tg{display:flex;justify-content:space-between;align-items:center;margin:12px 0 0;font-size:16px;opacity:1}.tg input{width:20px;height:20px;accent-color:#0a84ff}
.sheet select{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;padding:11px;font-size:16px;font-family:inherit}
.wgs{height:auto;max-width:none;grid-template-columns:none;gap:20px;grid-auto-rows:calc(2*(var(--is) + 46px) - 22px)}
.wl{background:#fafafa;color:#111;padding:0;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden}.wl svg{width:100%;height:100%;display:block}
.wx{background:linear-gradient(160deg,rgba(150,170,190,.8),rgba(105,125,150,.6));gap:4px;justify-content:flex-start}.wx .c{font-size:17px;font-weight:600}.wx .t{font-size:42px;font-weight:300;line-height:1.1}.wx span{display:block;font-size:14px}.wx small{color:#fff}
.gm{background:rgba(18,18,20,.82);justify-content:space-between;gap:10px}.gl{flex:1;overflow:auto;font-size:14px;line-height:1.5;white-space:pre-wrap;-webkit-user-select:text;user-select:text;opacity:.9}

.edit .app{touch-action:none}

.ins .ic{outline:2px dashed rgba(255,255,255,.55);outline-offset:4px}

.wg,.wl{border-radius:clamp(24px,3.4vw,36px)}
.gsw{gap:14px;justify-content:space-between;background:rgba(24,24,28,.78)}

.gg{font:700 26px/1 Arial,sans-serif;background:linear-gradient(90deg,#4285f4 25%,#ea4335 25% 50%,#fbbc05 50% 75%,#34a853 75%);-webkit-background-clip:text;background-clip:text;color:transparent}

.ph{display:block;aspect-ratio:1;border-radius:24%;background:rgba(255,255,255,.14)}
:focus-visible{outline:2px solid #5ac8ff;outline-offset:2px}
.grid{grid-template-columns:repeat(8,var(--cw));grid-auto-rows:var(--rh);justify-content:center;align-items:center;row-gap:0}

.td input:not([type]){background:rgba(255,255,255,.12);border:0;border-radius:14px;padding:8px 12px;color:#fff;font:inherit;outline:0}

 GA.busy=1;gDraw('…');
 try{const g=GEMS[c.g],r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GA.pro?'gemini-2.5-pro':encodeURIComponent(S.o.gm||'gemini-2.5-flash')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.o.gk},body:JSON.stringify({...(g?{systemInstruction:{parts:[{text:g[1]}]}}:{}),contents:c.m.slice(-20).map(x=>({role:x.r=='u'?'user':'model',parts:[{text:x.t}]}))})}),j=await r.json();
  if(!r.ok)throw Error(j.error&&j.error.message||r.status);c.m.push({r:'a',t:(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text).join('')||'（応答なし）'});save();GA.busy=0;gDraw()}
 catch(x){GA.busy=0;fail(x instanceof TypeError?'通信できません（オフライン、または通信が制限されたページです）':'エラー: '+x.message)}}
function openGem(m,nw){let el=$('#gapp');if(!el){el=document.createElement('div');el.id='gapp';document.body.appendChild(el)}
 if(m||nw){GA.id=null;GA.gem=-1}el.style.display='grid';gDraw();
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)el.animate([{opacity:0,transform:'scale(.94)',borderRadius:'40px'},{opacity:1,transform:'none',borderRadius:'0'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
 if(m)gSend(m);else{const q=$('#gaq');q&&q.focus()}}
function gClose(){$('#gapp').style.display='none';render();if(window.chatDraw)chatDraw()}
document.addEventListener('click',e=>{const b=e.target.closest('#gsend,#gclr');if(!b||e.target.closest('#wov'))return;e.stopImmediatePropagation();e.preventDefault();const q=$('#gq'),m=q?q.value.trim():'';if(q)q.value='';b.id=='gclr'?openGem('',1):openGem(m)},true);
document.addEventListener('click',e=>{const w=e.target.closest('.ai3');if(!w||edit||e.target.closest('#wov,input,button'))return;openGem()});
document.addEventListener('click',e=>{const a=e.target.closest('#gapp');if(!a)return;const t=e.target,q=$('#gaq'),d=x=>t.closest(x);let n;
 if(n=d('[data-gp]')){const c=S.gc.find(k=>k.id==n.dataset.gp);c.p=!c.p;save();gDraw();return}
 if(n=d('[data-gc]')){GA.id=n.dataset.gc;GA.gem=gCur().g;if(innerWidth<800)GA.nd=1;gDraw();return}
 if(n=d('[data-gem]')){GA.gem=+n.dataset.gem;GA.id=null;if(innerWidth<800)GA.nd=1;gDraw();return}
 if(n=d('[data-gch]')){q.value=GCH[n.dataset.gch][2];q.focus();return}
 if(!(n=d('[data-ga]')))return;const k=n.dataset.ga;
 if(k=='menu'){GA.nd=!GA.nd;a.classList.toggle('nodr',GA.nd)}
 else if(k=='new'){GA.id=null;GA.gem=-1;gDraw()}
 else if(k=='find'){GA.f=prompt('チャットを検索',GA.f)||'';gDraw()}
 else if(k=='close')gClose();
 else if(k=='pro'){GA.pro^=1;n.textContent=GA.pro?'思考モード':'高速モード'}
 else if(k=='send'){const m=q.value;q.value='';gSend(m)}
 else if(k=='mic'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('このブラウザは音声入力に対応していません');return}const r=new R();r.lang='ja-JP';r.onresult=ev=>{q.value+=ev.results[0][0].transcript};r.start()}});
document.addEventListener('keydown',e=>{const a=$('#gapp');if(!a||a.style.display!='grid')return;
 if(e.key=='Escape')gClose();else if(e.target.id=='gaq'&&e.key=='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();const m=e.target.value;e.target.value='';gSend(m)}});
document.addEventListener('input',e=>{if(e.target.id=='gaq'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}});
