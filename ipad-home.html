<title>ホーム画面ブックマーク</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sc:1;--is:calc(clamp(58px,8.2vw,92px)*var(--sc));--tx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#020a14;color:var(--tx);font-family:-apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
.wall{position:fixed;inset:0;background:radial-gradient(120% 80% at 20% 10%,#0a5f8f 0%,#053a60 35%,#01101f 75%);transition:filter .5s}

.glass{position:relative;isolation:isolate;--mx:30%;--my:0%;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 55%,rgba(255,255,255,.12));backdrop-filter:blur(var(--bl,20px)) saturate(2.2) brightness(1.12) contrast(1.05);-webkit-backdrop-filter:blur(var(--bl,20px)) saturate(2.2) brightness(1.12) contrast(1.05);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1.5px 1px rgba(255,255,255,.2),inset 1px 0 1px -.5px rgba(255,255,255,.3),inset 0 0 24px rgba(255,255,255,.07),0 14px 44px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.25)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 22%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.08) 72%,rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:-1;opacity:.85}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.32),transparent 45%),linear-gradient(180deg,rgba(255,255,255,.16),transparent 30%);pointer-events:none;z-index:-1}
.sb{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600;font-size:15px;z-index:5}

.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1.5px 2px -.5px rgba(255,255,255,.55),inset 0 0 12px rgba(255,255,255,.06);background:linear-gradient(160deg,rgba(255,255,255,.2),transparent 36%)}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from 200deg,rgba(255,255,255,.75),rgba(255,255,255,.04) 25%,rgba(255,255,255,.35) 55%,rgba(255,255,255,.04) 78%,rgba(255,255,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:1;opacity:.5;transition:opacity .3s}

.mn{display:none;position:absolute;top:-6px;left:2px;width:26px;height:26px;border-radius:50%;place-items:center;font-style:normal;font-size:20px;line-height:1;background:rgba(150,160,170,.85);backdrop-filter:blur(10px);z-index:2}
.edit .mn{display:grid}

#dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}
#dots i.on{background:#fff}

.sep{width:1px;height:calc(var(--is)*.7);background:rgba(255,255,255,.3);flex:none}
.plus{width:calc(var(--is)*.82);height:calc(var(--is)*.82);border-radius:23%;display:none;place-items:center;font-size:30px;flex:none;cursor:pointer;border:1px dashed rgba(255,255,255,.5);background:none;color:#fff}

.tb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:20px;right:20px;display:none;justify-content:space-between;z-index:9}
.edit .tb{display:flex}.edit .sb{visibility:hidden}
.tb div{display:flex;gap:10px}
.pill{border:0;color:#fff;font-size:15px;padding:9px 18px;border-radius:22px;cursor:pointer;font-family:inherit}

.lib{display:flex;flex-direction:column;gap:22px;align-items:center}

.ft .m{display:grid;grid-template-columns:1fr 1fr;gap:12%}

.ov{position:fixed;inset:0;display:none;z-index:20;background:rgba(0,10,25,.32)}
.ov.show{display:flex}

.sug{display:grid;grid-template-columns:repeat(auto-fill,calc(var(--is) + 20px));gap:16px;justify-content:center}
.row{display:flex;gap:14px;align-items:center;padding:8px;border-radius:14px;cursor:pointer;color:#fff;text-decoration:none}
.row:hover,.row.f{background:rgba(255,255,255,.16)}
.row .ic{width:44px;height:44px;font-size:24px;flex:none}

.sheet{margin:auto;width:min(460px,94vw);border-radius:30px;padding:22px;max-height:92%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}

.sheet input[type=text],.sheet textarea,.sheet input:not([type]){width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;padding:11px 13px;font-size:16px;font-family:inherit;outline:0}

.sw{display:flex;gap:8px;flex-wrap:wrap}

.btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.pill.pri{background:#0a84ff}.pill.del{background:rgba(255,69,58,.8);margin-right:auto}
.pill.g{background:rgba(255,255,255,.18)}
.hint{text-align:center;opacity:.6;font-size:13px;padding:30px}
.app:hover .ic{transform:scale(1.06);box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 14px rgba(140,200,255,.18)}.app:hover .ic::before{opacity:1}

.rec .mn{display:none!important}
.hf{display:flex;flex-direction:column;align-items:center;gap:7px;width:calc(var(--is) + 30px);cursor:pointer;font-size:13px}
.hf span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hf .ft{width:var(--is);height:var(--is);padding:9%;gap:5%;border-radius:23%;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}

.edit .hf .ft{animation:jig .25s infinite alternate}
.fi{display:block;margin:6px auto 18px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.3);color:#fff;font-size:20px;text-align:center;font-family:inherit;outline:0;width:60%}
.sz{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:22px;font-size:14px}.sz input{width:110px;accent-color:#5ac8ff}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(70px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(26px) scale(.93);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.boot .app,.boot .hf{animation:pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.boot #dock,.boot #dots{animation:rise .9s cubic-bezier(.2,.9,.3,1.1) both}
.ov.show{animation:ovin .25s both}.ov.show>.glass{animation:sheet .45s cubic-bezier(.2,.9,.3,1.15) both}
#dots i{transition:transform .3s,background .3s}#dots i.on{transform:scale(1.3)}
.pill{transition:transform .2s,filter .2s}.pill:hover{filter:brightness(1.2)}.pill:active{transform:scale(.94)}
.pg{will-change:transform}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ft{align-content:start}.ft .ic{height:auto;aspect-ratio:1}.hf .ft{grid-auto-rows:auto}
.glass::before{opacity:calc(.85*var(--gl,1))}.glass::after{opacity:var(--gl,1)}
.nolb .app span,.nolb .hf span{display:none}.noan *{animation:none!important;transition:none!important}

.wgs{display:grid;grid-template-columns:1fr 2fr;gap:22px;height:calc(2*(var(--is) + 52px) - 22px);margin:0 auto 22px;max-width:900px}

.sheet .tg{display:flex;justify-content:space-between;align-items:center;margin:12px 0 0;font-size:16px;opacity:1}.tg input{width:20px;height:20px;accent-color:#0a84ff}

.sheet input[type=password]{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;padding:11px 13px;font-size:16px;outline:0}
.edit .app{touch-action:none}
.ghost{opacity:.92;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));transition:none!important}.ghost .ic{transform:scale(1.12)}.ghost .mn{display:none!important}
.ins .ic{outline:2px dashed rgba(255,255,255,.55);outline-offset:4px}

.wg,.wl{border-radius:clamp(24px,3.4vw,36px)}
.gsw{gap:14px;justify-content:space-between;background:rgba(24,24,28,.78)}

<div class="ov" id="dov"><div class="sheet glass"><h3>データの書き出し・読み込み</h3><label>JSON（アイコン画像を含みます）</label><textarea id="ta" spellcheck="false"></textarea><div class="btns"><button class="pill g" id="dx">書き出し</button><button class="pill g" id="dh">ブックマークHTML</button><input type="file" id="dhf" accept=".html,.htm" hidden><button class="pill pri" id="di">読み込み</button><button class="pill g" id="dc">閉じる</button></div><div id="dm" class="hint" style="padding:10px"></div></div></div>

<div class="ov" id="gov"><div class="sheet glass" id="gs"></div></div>
<div id="cm" class="glass"></div><div id="ts" class="glass"></div>
<script>
const K='ipadhome.v1',COL=['#0a84ff','#30d158','#ff453a','#ff9f0a','#bf5af2','#ff375f','#64d2ff','#2c2c2e'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const D=(t,u,e,c,cat,dock)=>({id:Math.random().toString(36).slice(2,9),title:t,url:u,emoji:e,color:c,cat,dock:!!dock,icon:null,n:0,fold:''});
if(!S||!Array.isArray(S.items))S={wall:0,items:[
D('Google','https://www.google.com','G','#4285f4','検索',1),D('YouTube','https://www.youtube.com','▶','#ff0033','動画',1),D('Gmail','https://mail.google.com','✉','#ea4335','仕事効率化',1),D('Wikipedia','https://ja.wikipedia.org','W','#3a3a3c','調べもの',1),D('GitHub','https://github.com','🐙','#24292f','開発',1),
D('Claude','https://claude.ai','✳','#d97757','AI'),D('ChatGPT','https://chatgpt.com','◎','#10a37f','AI'),D('Gemini','https://gemini.google.com','✦','#5b7cfa','AI'),D('Google マップ','https://maps.google.com','📍','#34a853','調べもの'),D('翻訳','https://translate.google.com','文A','#4285f4','調べもの'),D('Google Drive','https://drive.google.com','△','#fbbc04','仕事効率化'),D('カレンダー','https://calendar.google.com','📅','#1a73e8','仕事効率化'),D('Spotify','https://open.spotify.com','♪','#1db954','動画'),D('Canva','https://www.canva.com','C','#7d2ae8','クリエイティブ'),D('MDN','https://developer.mozilla.org','{ }','#1b1b1b','開発'),D('NHK','https://www.nhk.or.jp','N','#0a5fb4','ニュース')]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const DEFO={lb:1,rec:1,wg:1,an:1,se:'google',bl:20,gl:100,ws:['date','dclock','aclock'],city:'',gk:'',gm:'gemini-2.5-flash'},SE={google:'https://www.google.com/search?q=',bing:'https://www.bing.com/search?q=',duckduckgo:'https://duckduckgo.com/?q='};
S.o=Object.assign({},DEFO,S.o||{});
const byId=id=>S.items.find(x=>x.id==id);
const ic=b=>`<div class="ic" style="background:${b.icon?'#222':`linear-gradient(160deg,${b.color},${b.color}cc)`}">${b.icon?`<img src="${esc(b.icon)}" alt="" draggable="false">`:esc(b.emoji||[...(b.title||'?')][0])}</div>`;
const app=b=>`<a class="app" data-id="${b.id}" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer" draggable="false">${ic(b)}<span>${esc(b.title)}</span>${b.badge?`<b class="bd">${esc(b.badge)}</b>`:''}<i class="mn">−</i></a>`;
let edit=false,page=0,lq='';
function layout(){const W=innerWidth,H=innerHeight,is=Math.min(92,Math.max(58,W*.082))*(S.sc||1),cols=W>1000?6:W>700?5:W>480?4:3,rows=Math.max(2,Math.floor((H-64-150)/(is+52)));return{cols,rows,per:cols*rows}}
function render(){
 document.documentElement.style.setProperty('--sc',S.sc||1);
 const {cols,rows,per}=layout(),raw=S.items.filter(b=>!b.dock&&!b.hid),seen={},home=[],ch=[];
 raw.forEach(b=>{if(!b.fold)home.push(b);else if(!seen[b.fold]){seen[b.fold]=1;home.push({fold:b.fold})}});
 const wr=S.o.wg?wrows(cols):0,p0=S.o.wg?cols*Math.max(1,rows-2*wr):per;ch.push(home.slice(0,p0));for(let i=p0;i<home.length;i+=per)ch.push(home.slice(i,i+per));
 let h=ch.map((c,pi)=>`<section class="pg">${pi||!S.o.wg?'':WG(cols)}<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${c.map(x=>x.fold?hf(x.fold):app(x)).join('')||'<div class="hint" style="grid-column:1/-1">「＋ 追加」でブックマークを追加</div>'}</div></section>`).join('');
 h+=`<section class="pg"><div class="lib"><label class="search glass"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="lq" placeholder="Appライブラリ" value="${esc(lq)}" autocomplete="off"></label><div id="lb"></div></div></section>`;
 const keep=$('#pages').scrollLeft;
 $('#pages').innerHTML=h;$('#pages').style.scrollBehavior='auto';$('#pages').scrollLeft=keep;
  const dk=S.items.filter(b=>b.dock&&!b.hid),rc=S.o.rec?S.items.filter(b=>!b.dock&&!b.hid).sort((a,b)=>b.n-a.n).slice(0,3):[];
 $('#dock').innerHTML=dk.map(app).join('')+(rc.length?'<div class="sep"></div>'+rc.map(b=>app(b).replace('class="app"','class="app rec"')).join(''):'')+'<button class="plus glass" id="dplus" aria-label="ドックに追加">＋</button>';
 $('#dots').innerHTML=Array(ch.length+1).fill(0).map((_,i)=>'<i></i>').join('');
 libRender();dots();document.body.classList.toggle('edit',edit);
 document.querySelectorAll('.app').forEach(a=>a.draggable=edit);
 applyOpts();wxInit();tickClk();
}
function folders(){
 const it=S.items.filter(b=>!b.hid),top=[...it].sort((a,b)=>b.n-a.n).slice(0,4),rec=[...it].reverse().slice(0,4),f=[['提案',top],['最近追加した項目',rec]],cats={};
 it.forEach(b=>{const c=b.cat||'その他';(cats[c]=cats[c]||[]).push(b)});
 Object.keys(cats).forEach(c=>f.push([c,cats[c]]));return f}
function libRender(){
 const el=$('#lb');if(!el)return;
 if(lq.trim()){const r=match(lq);el.innerHTML=`<div class="res">${r.map(app).join('')}</div>`||'';if(!r.length)el.innerHTML='<div class="hint">見つかりません</div>';return}
 el.innerHTML='<div class="folders">'+folders().map(([n,l],i)=>{const a=l.slice(0,4);const g=l.length>4?a.slice(0,3).map(ic).join('')+`<div class="m">${l.slice(3,7).map(ic).join('')}</div>`:a.map(ic).join('');return`<div class="fd" data-f="${i}" tabindex="0" role="button"><div class="ft glass">${g}</div>${esc(n)}</div>`}).join('')+'<div class="fd" data-hid="1" tabindex="0" role="button"><div class="ft glass hd"><i class="ph"></i><i class="ph"></i><i class="ph"></i><i class="ph"></i></div>非表示</div></div>'}
function match(q){q=q.toLowerCase();return S.items.filter(b=>!b.hid&&(b.title+' '+b.url+' '+(b.cat||'')).toLowerCase().includes(q))}
function dots(){const p=$('#pages'),x=p.scrollLeft/p.clientWidth,i=Math.round(x);page=i;[...$('#dots').children].forEach((d,j)=>d.classList.toggle('on',j==i));
 [...p.children].forEach((s,j)=>{const d=Math.min(1,Math.abs(x-j));s.style.transform=`scale(${1-.07*d})`;s.style.opacity=1-.6*d})}
$('#pages').addEventListener('scroll',dots);
function go(i){const p=$('#pages');p.style.scrollBehavior='smooth';p.scrollLeft=i*p.clientWidth}
$('#dots').onclick=e=>{const i=[...$('#dots').children].indexOf(e.target);if(i>=0)go(i)};
addEventListener('keydown',e=>{const t=e.target.tagName;
 if(e.key=='Escape')closeAll();
 else if(t!='INPUT'&&t!='TEXTAREA'){if(e.key=='/'){e.preventDefault();openSearch()}else if(e.key=='ArrowRight')go(Math.min(page+1,$('#dots').children.length-1));else if(e.key=='ArrowLeft')go(Math.max(0,page-1))}});
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,150)});
function closeAll(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'))}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('pointerdown',e=>{if(e.target===o)o.classList.remove('show')}));
/* clock & battery */
function tick(){const d=new Date();$('#clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,10000);
try{navigator.getBattery().then(b=>{const u=()=>{$('#bat').textContent=Math.round(b.level*100)};u();b.onlevelchange=u})}catch(e){}
/* long press / clicks */
let lp=null,lpFired=false;
document.addEventListener('pointerdown',e=>{const a=e.target.closest('.app,.hf');if(!a||edit)return;lpFired=false;lp=setTimeout(()=>{lpFired=true;showMenu(a,e)},550)});
['pointerup','pointercancel','pointermove'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lp)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('textarea,input'))return;const a=e.target.closest('.app,.hf');if(a){e.preventDefault();if(!edit)showMenu(a,e)}else if(e.target.closest('.pg')){e.preventDefault();if(!edit)setEdit(true)}});
function setEdit(v){edit=v;document.body.classList.toggle('edit',v);document.querySelectorAll('.app').forEach(a=>a.draggable=v)}
document.addEventListener('click',e=>{
 const a=e.target.closest('.app');
 if(a){const b=byId(a.dataset.id);
  if(lpFired){e.preventDefault();lpFired=false;return}
  if(edit){e.preventDefault();if(e.target.closest('.mn')){delItem(b)}else openEd(b);return}
  b.n++;save();launch(a);return}
 const h=e.target.closest('.hf');if(h){if(lpFired){lpFired=false;return}openHF(h.dataset.hf);return}
 const f=e.target.closest('.fd');if(f){f.dataset.hid?openHidden():openFolder(+f.dataset.f)}
});
$('#done').onclick=()=>setEdit(false);
$('#add').onclick=()=>openEd(null,false);$('#dock').addEventListener('click',e=>{if(e.target.closest('#dplus'))openEd(null,true)});
$('#wl').onclick=()=>{drawSet();$('#gov').classList.add('show')};
document.addEventListener('input',e=>{if(e.target.id=='lq'){lq=e.target.value;libRender()}});
function openFolder(i){const [n,l]=folders()[i];$('#fpanel').innerHTML=`<h3 style="margin:8px 0 18px">${esc(n)}</h3><div class="res">${l.map(app).join('')}</div>`;$('#fov').classList.add('show')}
/* drag reorder (edit mode) */
let dragId=null;
document.addEventListener('dragstart',e=>{const a=e.target.closest('.app');if(!edit||!a){e.preventDefault();return}dragId=a.dataset.id;a.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const x=e.clientX,n=Date.now();if((x<60||x>innerWidth-60)&&n-(window._ft||0)>900){window._ft=n;go(Math.max(0,Math.min($('#dots').children.length-1,page+(x<60?-1:1))))}});
document.addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const a=e.target.closest('.app'),d=byId(dragId);
 const hf0=e.target.closest('.hf');
 if(hf0){d.fold=hf0.dataset.hf;d.dock=false}
 else if(a&&a.dataset.id!=dragId){const t=byId(a.dataset.id),r=a.getBoundingClientRect();S.items=S.items.filter(x=>x!=d);
  if(!t.dock&&!t.fold&&Math.abs(e.clientX-r.left-r.width/2)<r.width*.2&&Math.abs(e.clientY-r.top-r.height*.35)<r.height*.22){t.fold=d.fold='新しいフォルダ';d.dock=false;S.items.splice(S.items.indexOf(t)+1,0,d)}
  else{d.dock=t.dock;d.fold=t.dock?'':(t.fold||'');S.items.splice(S.items.indexOf(t),0,d)}}
 else if(e.target.closest('#dock')){d.dock=true;S.items=S.items.filter(x=>x!=d);S.items.push(d)}
 else if(e.target.closest('.pg')){const la=[...e.target.closest('.pg').querySelectorAll('.grid .app')].filter(x=>x.dataset.id!=dragId).pop(),t=la&&byId(la.dataset.id);S.items=S.items.filter(x=>x!=d);d.dock=false;d.fold='';if(t)S.items.splice(S.items.indexOf(t)+1,0,d);else S.items.push(d)}
 dragId=null;save();render()});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))});
/* editor */
let cur=null,isNew=false;
function fixUrl(u){u=u.trim();return u&&!/^[a-z][a-z0-9+.-]*:/i.test(u)?'https://'+u:u}
function openEd(b,dock){$('#fov').classList.remove('show');isNew=!b;cur=b?{...b}:D('','','','#0a84ff','その他',dock);drawEd();$('#eov').classList.add('show')}
function drawEd(){
 const cats=[...new Set(S.items.map(x=>x.cat).filter(Boolean))];
 $('#ed').innerHTML=`<h3>${isNew?'ブックマークを追加':'ブックマークを編集'}</h3>
 <div class="pv" id="pv">${ic(cur)}<div style="flex:1"><button class="pill g" id="up" style="width:100%">画像をアップロード</button>${cur.icon?'<button class="pill g" id="clr" style="width:100%;margin-top:8px">画像を削除</button>':''}<input type="file" id="fi" accept="image/*" hidden></div></div>
 <label>タイトル</label><input type="text" id="et" value="${esc(cur.title)}" placeholder="例: Wikipedia">
 <label>URL</label><input type="text" id="eu" value="${esc(cur.url)}" placeholder="https://example.com" inputmode="url">
 <label>アイコンの文字・絵文字（画像がないとき）</label><input type="text" id="ee" value="${esc(cur.emoji)}" maxlength="3">
 <label>アイコンの色</label><div class="sw">${COL.map(c=>`<b data-c="${c}" style="background:${c}" class="${c==cur.color?'on':''}"></b>`).join('')}<input type="color" id="ec" value="${/^#[0-9a-f]{6}$/i.test(cur.color)?cur.color:'#0a84ff'}" style="width:32px;height:28px;border:0;background:none;padding:0"></div>
 <label>Appライブラリのカテゴリ</label><input type="text" id="ecat" list="cl" value="${esc(cur.cat)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <label>ホーム画面のフォルダ（空欄でなし）</label><input type="text" id="efd" value="${esc(cur.fold)}">
 <label>バッジ（赤い数字・空欄でなし）</label><input type="text" id="eb" value="${esc(cur.badge)}" maxlength="3">
 <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="ed2" ${cur.dock?'checked':''}> ドックに置く</label>
 <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="ehd" ${cur.hid?'checked':''}> 非表示フォルダに入れる</label>
 <div class="btns">${isNew?'':'<button class="pill del" id="edel">削除</button>'}<button class="pill g" id="ecan">キャンセル</button><button class="pill pri" id="esv">保存</button></div>`;
 const sync=()=>{cur.title=$('#et').value;cur.url=$('#eu').value;cur.emoji=$('#ee').value;cur.cat=$('#ecat').value;cur.fold=$('#efd').value.trim();cur.badge=$('#eb').value.trim();cur.dock=$('#ed2').checked;cur.hid=$('#ehd').checked;if(cur.hid){cur.dock=false;cur.fold=''}};
 $('#up').onclick=()=>$('#fi').click();
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;sync();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);cur.icon=c.toDataURL('image/png');drawEd()};im.src=r.result};r.readAsDataURL(f)};
 if($('#clr'))$('#clr').onclick=()=>{sync();cur.icon=null;drawEd()};
 document.querySelectorAll('.sw b').forEach(b=>b.onclick=()=>{sync();cur.color=b.dataset.c;drawEd()});
 $('#ec').onchange=e=>{sync();cur.color=e.target.value;drawEd()};
 $('#ecan').onclick=()=>$('#eov').classList.remove('show');
 if($('#edel'))$('#edel').onclick=()=>{S.items=S.items.filter(x=>x.id!=cur.id);save();$('#eov').classList.remove('show');render()};
 $('#esv').onclick=()=>{sync();cur.url=fixUrl(cur.url);if(!cur.url){$('#eu').focus();$('#eu').style.borderColor='#ff453a';return}
  if(!cur.title.trim())cur.title=cur.url.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
  const i=S.items.findIndex(x=>x.id==cur.id);if(i<0)S.items.push(cur);else S.items[i]=cur;
  save();$('#eov').classList.remove('show');render()};
}
/* search */
function openSearch(){closeAll();$('#sov').classList.add('show');$('#q').value='';sres();setTimeout(()=>$('#q').focus(),50)}
$('#sbtn').onclick=openSearch;
function sres(){
 const q=$('#q').value.trim(),el=$('#sres');
 if(!q){el.innerHTML='<h4>Siriからの提案</h4><div class="sug">'+S.items.filter(b=>!b.hid).sort((a,b)=>b.n-a.n).slice(0,12).map(app).join('')+'</div>';return}
 const r=match(q);
 el.innerHTML=(r.length?'<h4>ブックマーク</h4>':'')+r.slice(0,8).map((b,i)=>`<a class="row ${i?'':'f'}" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer" data-id="${b.id}">${ic(b)}<div>${esc(b.title)}<small>${esc(b.url)}</small></div></a>`).join('')+
 `<h4>ウェブ</h4><a class="row ${r.length?'':'f'}" href="${/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(q)?esc(fixUrl(q)):SE[S.o.se]+encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer"><div class="ic" style="background:#3a3a3c;width:44px;height:44px;font-size:22px">🔍</div><div>「${esc(q)}」を検索<small>ウェブ検索 / URLを直接開く</small></div></a>`}
$('#q').oninput=sres;
$('#q').onkeydown=e=>{const rs=[...document.querySelectorAll('#sres .row')],i=rs.findIndex(x=>x.classList.contains('f'));
 if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();if(!rs.length)return;rs[i]&&rs[i].classList.remove('f');const n=(i+(e.key=='ArrowDown'?1:-1)+rs.length)%rs.length;rs[n].classList.add('f');rs[n].scrollIntoView({block:'nearest'})}
 else if(e.key=='Enter'){const r=$('#sres .row.f')||$('#sres .app');if(r)r.click()}};
$('#sres').addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(a){const b=byId(a.dataset.id);if(b){b.n++;save()}}});
/* data */
$('#dt').onclick=()=>{$('#ta').value='';$('#dm').textContent='';$('#dov').classList.add('show')};
$('#dc').onclick=()=>$('#dov').classList.remove('show');
$('#dx').onclick=()=>{$('#ta').value=JSON.stringify({...S,o:{...S.o,gk:''}});$('#ta').select();$('#dm').textContent='コピーして保存してください。'};
$('#di').onclick=()=>{try{const j=JSON.parse($('#ta').value);if(!Array.isArray(j.items))throw 0;S=j;S.wall=S.wall||0;S.o=Object.assign({},DEFO,S.o||{});save();render();$('#dov').classList.remove('show')}catch(e){$('#dm').textContent='読み込めませんでした。JSONを確認してください。'}};
const sqp=(i,k)=>{const a=i*Math.PI/30,f=v=>Math.sign(v)*Math.sqrt(Math.abs(v));return[f(Math.sin(a))*k,f(-Math.cos(a))*k]};
const wsp=(id,c)=>id=='memo'||id=='gsearch'?Math.min(c,4):(c>=4?2:c);
function wrows(c){let r=1,u=0;S.o.ws.forEach(id=>{const q=wsp(id,c);if(u+q>c){r++;u=0}u+=q});return S.o.ws.length?r:0}
const WGS={
 date:()=>{const d=new Date();return`<div class="wg wd glass"><small>${'日月火水木金土'[d.getDay()]}曜日</small><b>${d.getDate()}日</b><em>${d.getFullYear()}年${d.getMonth()+1}月</em></div>`},

 if(edit)$('#fn').onchange=e=>{const v=e.target.value.trim();S.items.forEach(b=>{if(b.fold==n)b.fold=v});save();$('#fov').classList.remove('show');render()}}
$('#sz').value=Math.round((S.sc||1)*100);
$('#sz').oninput=e=>{S.sc=e.target.value/100;save();clearTimeout(window._z);window._z=setTimeout(render,60)};
document.addEventListener('pointermove',e=>{const g=e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)/r.width*100+'%');g.style.setProperty('--my',(e.clientY-r.top)/r.height*100+'%')});
function launch(a){const c=a.querySelector('.ic');if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=c.getBoundingClientRect(),d=document.createElement('div');
 d.style.cssText=`position:fixed;z-index:50;pointer-events:none;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:23%;background:${c.style.background||'#222'}`;
 document.body.appendChild(d);d.animate([{transform:'scale(1)',opacity:1},{transform:`scale(${Math.max(innerWidth,innerHeight)/r.width*1.4})`,opacity:0}],{duration:520,easing:'cubic-bezier(.3,.7,.2,1)'}).onfinish=()=>d.remove()}
render();document.body.classList.add('boot');
document.querySelectorAll('.grid .app,.hf').forEach((a,i)=>a.style.animationDelay=i*28+'ms');
setTimeout(()=>{document.body.classList.remove('boot');document.querySelectorAll('.app,.hf').forEach(a=>a.style.animationDelay='')},1900);
</script></body></html>
